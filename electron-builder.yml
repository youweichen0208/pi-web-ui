# pi-web-ui Electron 打包配置
# 构建：npm run build:electron 或 npm run build:electron:mac / :win / :linux
# （发布到 GitHub Releases 的 CI 流程当前未接，需要时再补 publish 配置）

appId: com.youweichen.pi-web-ui
productName: pi
copyright: Copyright © 2026 youweichen

# electron-builder 26.x 起，没有显式配置时 executableName 会从 package.json 的
# "name" 字段推导（不是 productName），而我们的 "name" 是带 scope 的 npm 包名
# "@youweichen/pi-web-ui" —— 25.x 之前没这个问题，是这次升级到 26.15.3 才炸出来的。
# 显式指定成 productName 同一个值，避免再从 package.json 的 name 推导。
executableName: pi

directories:
  output: release
  buildResources: build

# Electron 主进程入口（已在 package.json main 中指定）
# 默认行为：打包所有文件，排除常见开发文件

# 不用 asar。两个原因，都是实打实踩过的：
#
# 1. server 是 fork 出去的独立 Node 进程（ELECTRON_RUN_AS_NODE=1），它 import
#    express / ws 这些依赖时走的是 Node 自己的 ESM 解析器——从入口文件往上逐层
#    找 node_modules。而 ESM 解析器读不进 asar 包里（asar 是靠给 fs 打补丁实现
#    的，ESM 的内部解析绕过了那层补丁）。原来 dist 走 extraResources 放在
#    Resources/dist，node_modules 却在 Resources/app.asar 里，两者根本不在同一
#    条向上查找的路径上，于是 app 一启动就是
#    "Cannot find package 'express'"。
# 2. node-pty 是原生模块，.node 文件也得是磁盘上的真文件才能 dlopen——原来
#    asarUnpack 是空的，等于没给它留出口。
#
# 关掉 asar 之后，所有东西（dist、web/dist、extensions、剪枝过的生产依赖）都平
# 铺在 Resources/app/ 下，server 从 Resources/app/dist/server/index.js 往上找一
# 层就是 Resources/app/node_modules，Node 原生的解析规则直接就通了，不需要任何
# 额外的路径拼接。代价是文件数量多一些、源码没打包，对这个项目无所谓。
asar: false

# 默认会把整个项目目录带上，这里去掉运行时用不到的部分（源码、测试、CI 配置）。
# 生产依赖 node_modules 由 electron-builder 自己剪枝并始终包含，不用在这里列。
files:
  - "**/*"
  - "!release/**"
  - "!server/**"
  - "!tests/**"
  - "!scripts/**"
  - "!docs/**"
  - "!web/src/**"
  - "!web/public/**"
  - "!.github/**"
  - "!deploy/**"
  - "!dev/**"
  - "!assets/**"
  - "!Dockerfile"
  - "!docker-compose.yml"
  - "!.dockerignore"
  - "!AGENTS.md"
  - "!file-upload-browser-test.mjs"
  # Cowork 在仓库根建的目录，可能装着随手生成的文件，别跟着 app 发出去
  - "!Claude outputs/**"

# 原生模块：electron-builder 自动 rebuild（node-pty 等）
# 不需要额外配置，默认行为就是 rebuild
npmRebuild: true

# 图标：build/icon.png（1024x1024）。electron-builder 会自动为各平台生成
# .icns / .ico，不需要手动提供平台专属格式。
icon: build/icon.png

# macOS
mac:
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.developer-tools
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null  # 没有 Apple 开发者证书，不做正式签名/公证
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"

# 没有正式签名证书时，arm64 (Apple Silicon) 完全不签名的 app 会被系统判定为
# 「已损坏」，比「无法验证开发者」更严重——右键打开都绕不过，只能让用户手动
# `xattr -cr`。用 afterPack 钩子做一次免费的 ad-hoc 签名（不需要开发者账号），
# 把体验降级成常见的「无法验证开发者」，用户右键打开就能用。见 build/afterPack.cjs。
afterPack: build/afterPack.cjs

# Windows
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
    - target: zip       # 不需要 wine 就能在非 Windows 机器上交叉构建（已验证）；nsis/portable 需要真机 Windows 或装了 wine 的机器
      arch:
        - x64
  icon: build/icon.ico
  # 不签名
  signAndEditExecutable: false
  artifactName: "${productName}-${version}-win-x64.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: pi
  artifactName: "${productName}-${version}-setup-x64.${ext}"

# Linux
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"

# 发布：push v* tag 时由 .github/workflows/release-desktop.yml 触发，
# 三平台各自 electron-builder build --publish always 上传到 GitHub Releases
# （GITHUB_TOKEN 自带，workflow 里已经给了 contents: write 权限，不用额外配置）。
publish:
  provider: github
  owner: youweichen0208
  repo: pi-web-ui
  releaseType: release
