name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 协议双端手工同步校验（server/protocol.ts ↔ web/src/types.ts）
      - name: Check protocol sync
        run: node scripts/check-protocol-sync.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # 纯函数单测（毫秒级、零 token）
      - name: Unit tests
        run: npx vitest run

      # 零 token 协议冒烟（每个测试自起隔离 server：独立端口 + 临时 data-dir）
      - name: Protocol smoke tests
        run: node tests/run-smoke.mjs

  node-workbench:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:server
      - run: node tests/node-workbench-test.mjs
