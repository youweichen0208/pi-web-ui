# 一次性验证用：在真机 Windows runner 上确认 Electron 桌面版能正常构建 + node-pty
# 终端功能在 Windows 上真的能跑（本地在 mac/Linux 沙箱里只能跳过 rebuild 交叉出 zip，
# 没法验证这一步）。手动触发（Actions 页 "Run workflow"），验证完可以把这个文件删掉，
# 不是常驻 CI，不影响 ci.yml。
name: Verify Windows desktop build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release to diagnose (blank builds the checkout)"
        type: string
        default: ""

jobs:
  verify:
    if: ${{ inputs.release_tag == '' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python (setuptools for node-gyp)
        run: python3 -m pip install --upgrade setuptools

      - name: Install dependencies
        run: npm ci

      - name: Build web + server
        run: npm run build

      # 先在普通 Node 下跑一遍终端冒烟测试：确认 node-pty 自带的
      # prebuilds/win32-x64/pty.node 在真机 Windows 上能正常 spawn/收发数据。
      #
      # continue-on-error：node-pty 在 Windows 上有个已知上游 bug —— 清理阶段
      # conpty_console_list_agent.js 里 getConsoleProcessList() 偶发
      # "AttachConsole failed"（openai/codex #25272 #25372、opencode #32389 等
      # 多个项目都中招，上游没吞掉这个异常，不是我们代码的问题）。这个是一次性
      # 验证工作流，出这个已知噪音不该拦住后面继续跑，靠下面的 warning 注解留痕。
      - name: Terminal smoke test (plain Node)
        id: smoke_test_plain
        continue-on-error: true
        run: node tests/terminal-smoke-test.mjs

      - name: Warn if plain-node smoke test failed
        if: steps.smoke_test_plain.outcome == 'failure'
        run: echo "::warning::Plain-node terminal smoke test failed — likely the known node-pty AttachConsole upstream bug, continuing anyway."

      # electron-builder 默认 npmRebuild: true，会用 @electron/rebuild + node-gyp
      # 把 node-pty 针对 Electron 的 Node ABI 重新编译一遍（这一步在 mac/Linux 上
      # 交叉构建时会直接报错，只有真机 Windows 才能跑；windows-latest runner 自带
      # 编译工具链，这里应该会成功）。产出 nsis 安装包 + portable 绿色版 + zip。
      - name: Build Electron desktop app (real npmRebuild)
        run: npm run build:electron:win

      # 用打包出来的 pi-web-ui.exe 本身（内置的 Electron 运行时）以
      # ELECTRON_RUN_AS_NODE=1 跑一遍同一个终端冒烟测试 —— 这跟 electron/main.mjs
      # 里 fork() server 子进程的方式完全一致，是对生产路径最贴近的验证：
      # 确认 electron-rebuild 出来的 node-pty 在真实 Electron 里也能用，
      # 不只是在普通 Node 下能用。
      # 同上：node-pty 的 AttachConsole 已知上游 bug 在这一步也可能出现，
      # continue-on-error，失败时打 warning 注解而不是整个 job 标红。
      - name: Terminal smoke test (under packaged Electron runtime)
        id: smoke_test_packaged
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter "pi-web-ui.exe" -Path release | Select-Object -First 1
          if (-not $exe) { throw "pi-web-ui.exe not found under release/" }
          Write-Host "Using $($exe.FullName)"
          $env:ELECTRON_RUN_AS_NODE = "1"
          & $exe.FullName "tests/terminal-smoke-test.mjs"
          if ($LASTEXITCODE -ne 0) { throw "terminal smoke test failed under packaged Electron runtime (exit $LASTEXITCODE)" }

      - name: Warn if packaged-runtime smoke test failed
        if: steps.smoke_test_packaged.outcome == 'failure'
        run: echo "::warning::Packaged-Electron terminal smoke test failed — likely the known node-pty AttachConsole upstream bug, continuing anyway."

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: pi-web-ui-windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 7

  diagnose-release:
    if: ${{ inputs.release_tag != '' }}
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download published Windows packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download $env:RELEASE_TAG --pattern '*win-x64.zip' --pattern '*setup-x64.exe' --dir "$env:RUNNER_TEMP/packages"
          if ($LASTEXITCODE -ne 0) { throw "Release download failed" }
      - name: Start published ZIP in a path with spaces and Chinese characters
        shell: pwsh
        run: |
          $zip = Get-ChildItem "$env:RUNNER_TEMP/packages/*win-x64.zip" | Select-Object -First 1
          $dest = "$env:RUNNER_TEMP/桌面测试/portable pi"
          Expand-Archive $zip.FullName $dest
          node tests/packaged-server-start-test.mjs "$dest/pi.exe" "$dest/resources/app"
          if ($LASTEXITCODE -ne 0) { throw "Published ZIP cannot start" }
      - name: Install NSIS and start installed server
        shell: pwsh
        run: |
          $installer = Get-ChildItem "$env:RUNNER_TEMP/packages/*setup-x64.exe" | Select-Object -First 1
          $dest = Join-Path $env:LOCALAPPDATA "Programs\pi-test"
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', '/currentuser', "/D=$dest") -PassThru
          if (-not $proc.WaitForExit(180000)) { throw "Installer did not exit within 180 seconds" }
          if ($proc.ExitCode -ne 0) { throw "Installer failed: $($proc.ExitCode)" }
          if (-not (Test-Path "$dest/pi.exe")) {
            $installed = Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter pi.exe -Recurse | Select-Object -First 1
            if (-not $installed) { throw "Installer exited without an installed pi.exe" }
            $dest = $installed.DirectoryName
          }
          Write-Host "Installed app: $dest"
          node tests/packaged-server-start-test.mjs "$dest/pi.exe" "$dest/resources/app"
          if ($LASTEXITCODE -ne 0) { throw "Installed server cannot start" }
