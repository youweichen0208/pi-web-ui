# pi-web-ui Electron 桌面版发布 CI
# 在 tag（v*）推送时触发：三平台各自构建安装包并上传到 GitHub Releases
# （electron-builder.yml 里的 publish: provider: github 配置生效）。
# 也支持手动触发（workflow_dispatch），比如某个平台构建失败要单独重跑。
#
# 当前不签名（Mac / Windows 都没配证书）：
#   - macOS：用户首次打开会被 Gatekeeper 拦「无法验证开发者」，右键选
#     「打开」即可跳过，不影响正常使用。
#   - Windows：SmartScreen 可能会有一次「未知发布者」提示，点「仍要运行」即可。
# 以后要签名的话，mac 端加 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
# APPLE_TEAM_ID / CSC_LINK / CSC_KEY_PASSWORD 几个 repo secrets，
# electron-builder 会自动识别并签名+公证，不需要改这个 workflow。
#
# Reference: https://www.electron.build/configuration/publish

name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台"
        type: choice
        options:
          - all
          - mac
          - win
          - linux
        default: all

permissions:
  contents: write

jobs:
  build-mac:
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'mac' }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python (setuptools for node-gyp)
        run: python3 -m pip install --upgrade setuptools --break-system-packages

      - name: Install dependencies
        run: npm ci

      - name: Build web + server
        run: npm run build

      - name: Build + publish Electron (macOS)
        run: npx electron-builder build --mac --arm64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 签名（可选）——上面几个 secrets 没配的话就是未签名构建

  build-win:
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'win' }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python (setuptools for node-gyp)
        run: python3 -m pip install --upgrade setuptools

      - name: Install dependencies
        run: npm ci

      - name: Build web + server
        run: npm run build

      # 跟 verify-windows-desktop.yml 一样，真机跑一遍终端冒烟测试再打包，
      # 出了问题 release 阶段就能发现，不用等用户下载了才报告 bug。
      #
      # 终端读写失败必须阻断发布；AttachConsole 清理竞态由
      # server/patch-node-pty.ts 处理，不能把整条冒烟测试标成可忽略。
      - name: Terminal smoke test (plain Node)
        run: node tests/terminal-smoke-test.mjs

      - name: Build Electron (Windows)
        run: npx electron-builder build --win --x64 --publish never

      - name: Verify packaged server and portable relaunch
        shell: pwsh
        run: |
          node tests/packaged-server-start-test.mjs release/win-unpacked/pi.exe release/win-unpacked/resources/app
          if ($LASTEXITCODE -ne 0) { throw "Packaged server cannot start" }
          $portable = Get-ChildItem release/*win-x64.exe | Select-Object -First 1
          ./tests/portable-relaunch-test.ps1 -PortableExe $portable.FullName

      - name: Publish verified Windows packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --title $tag --notes "Desktop release $version"
            if ($LASTEXITCODE -ne 0) {
              # Another platform may have created the release concurrently.
              gh release view $tag
              if ($LASTEXITCODE -ne 0) { throw "Cannot create release" }
            }
          }
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.zip', '.blockmap' -or $_.Name -eq 'latest.yml' }
          if ($assets.Count -lt 5) { throw "Windows release assets are incomplete" }
          gh release upload $tag @($assets.FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }

  build-linux:
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install system deps (node-gyp)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-setuptools 2>/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Build web + server
        run: npm run build

      - name: Build + publish Electron (Linux)
        run: npx electron-builder build --linux --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
